name: ci
on:
  push:
    branches: ['**']
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run tokens
      - run: bun run test
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with: { bun-version: 1.3.13 }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun run docs:build
      - run: node scripts/verify-fixture.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: { name: docs, path: docs/dist, retention-days: 14 }
  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - run: |
          set -euo pipefail
          bad=$(grep -rhoE 'uses:\s*[^@ ]+@[^ ]+' .github/workflows | grep -vE '@[0-9a-f]{40}$' || true)
          if [ -n "$bad" ]; then echo "Actions non épinglées par empreinte :"; echo "$bad"; exit 1; fi
          echo "Toutes les actions sont épinglées par empreinte."
